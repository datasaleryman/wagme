<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wagmecoin</title>
  <meta name="description" content="WAGME meme gallery and community showcase" />
  <meta property="og:title" content="wagmecoin" />
  <meta property="og:description" content="WAGME meme gallery and community showcase" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #1f1f1f;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }
    .site {
      width: min(100vw, 1060px);
      background: #111;
    }
    .section {
      display: block;
      width: 100%;
      height: auto;
    }
    .gallery {
      position: relative;
      width: 100%;
      aspect-ratio: 1320/325;
      background: url('/carousel-bg.png') center/cover no-repeat;
      overflow: hidden;
    }
    .card {
      position: absolute;
      top: 14.2%;
      width: 14.62%;
      height: 80.6%;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(145, 145, 145, 0.55);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      background: #111;
    }
    .card1 { left: 36.5%; }
    .card2 { left: 52.5%; }
    .card3 { left: 68.4%; }
    .card4 { left: 84.4%; }
    .nav {
      position: absolute;
      bottom: 6.5%;
      width: 3.1%;
      aspect-ratio: 1/1;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    .nav.prev { left: 91.2%; }
    .nav.next { left: 94.35%; }
    .nav:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 760px) {
      .site { width: 100vw; }
    }
    .section-wrap {
      position: relative;
      width: 100%;
    }
    .join-community-link {
      position: absolute;
      display: block;
      z-index: 8;
      border-radius: 8px;
      cursor: pointer;
    }
    .join-community-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }
    .top-join-community {
      left: 57.73%;
      top: 1.23%;
      width: 13.18%;
      height: 3.26%;
    }
    .bottom-join-community {
      left: 49.92%;
      top: 33.95%;
      width: 12.80%;
      height: 9.47%;
    }
  </style>
</head>
<body>
  <div class="site">
    <div class="section-wrap top-section">
      <img class="section" src="/top-section.png" alt="WAGME website top section" />
      <a class="join-community-link top-join-community" href="https://x.com/wagme_me" target="_blank" rel="noopener noreferrer" aria-label="Join WAGME community on X"></a>
    </div>
    <div class="gallery" id="gallery" aria-label="Meme Gallery carousel">
      <img class="card card1" id="card1" src="/memes/meme_0_0.png" alt="Meme 1" />
      <img class="card card2" id="card2" src="/memes/meme_0_1.png" alt="Meme 2" />
      <img class="card card3" id="card3" src="/memes/meme_0_2.png" alt="Meme 3" />
      <img class="card card4" id="card4" src="/memes/meme_0_3.png" alt="Meme 4" />
      <button class="nav prev" id="prevBtn" aria-label="Previous memes"><span class="sr-only">Previous</span></button>
      <button class="nav next" id="nextBtn" aria-label="Next memes"><span class="sr-only">Next</span></button>
    </div>
    <div class="section-wrap bottom-section">
      <img class="section" src="/bottom-section.png" alt="WAGME website bottom section" />
      <a class="join-community-link bottom-join-community" href="https://x.com/wagme_me" target="_blank" rel="noopener noreferrer" aria-label="Join WAGME community on X"></a>
    </div>
  </div>

  <script>
    const pages = [
      ["/memes/meme_0_0.png", "/memes/meme_0_1.png", "/memes/meme_0_2.png", "/memes/meme_0_3.png"],
      ["/memes/meme_1_0.png", "/memes/meme_1_1.png", "/memes/meme_1_2.png", "/memes/meme_1_3.png"],
      ["/memes/meme_2_0.png", "/memes/meme_2_1.png", "/memes/meme_2_2.png", "/memes/meme_2_3.png"],
      ["/memes/meme_3_0.png", "/memes/meme_3_1.png", "/memes/meme_3_2.png", "/memes/meme_3_3.png"],
      ["/memes/meme_4_0.png", "/memes/meme_4_1.png", "/memes/meme_4_2.png", "/memes/meme_4_3.png"],
      ["/memes/meme_5_0.png", "/memes/meme_5_1.png", "/memes/meme_5_2.png", "/memes/meme_5_3.png"]
    ];

    let currentPage = 0;
    const cards = [
      document.getElementById('card1'),
      document.getElementById('card2'),
      document.getElementById('card3'),
      document.getElementById('card4')
    ];

    function renderPage() {
      const page = pages[currentPage];
      cards.forEach((card, i) => {
        card.src = page[i];
        card.alt = `Meme ${currentPage * 4 + i + 1}`;
      });
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentPage = (currentPage - 1 + pages.length) % pages.length;
      renderPage();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentPage = (currentPage + 1) % pages.length;
      renderPage();
    });
  </script>
</body>
</html>
